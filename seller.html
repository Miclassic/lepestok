<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лепесток · кабинет продавца</title>
<link href="https://fonts.cdnfonts.com/css/opposans" rel="stylesheet">
<style>
:root{--bg:#FFF7F5;--card:#FFFFFF;--ink:#1A1A2E;--gray:#94A3B8;--red:#EF4444;--yel:#F59E0B;--grn:#10B981;--gold:#D97706;--coral:#FF6B6B;--pink:#FF6B9D;--purple:#A855F7;--gradient:linear-gradient(135deg,#FF6B6B 0%,#FF6B9D 50%,#A855F7 100%);--glass:rgba(255,255,255,.9);--shadow:0 6px 20px rgba(120,60,10,.08)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'OPPO Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(160deg,#FFF7F5 0%,#FFEDEB 45%,#F6ECFF 100%);color:var(--ink);min-height:100vh}
.top{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 4px 24px rgba(0,0,0,.06)}
.topIn{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px}
.shopAva{width:44px;height:44px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;box-shadow:0 6px 18px rgba(255,107,107,.35);color:#fff}
.shopAva .icn{width:22px;height:22px}
.shopAva img{width:100%;height:100%;object-fit:cover}
.shopName{font-weight:800;font-size:15px}
.shopStatus{font-size:10.5px;color:var(--grn);font-weight:700;display:flex;align-items:center;gap:4px}
.shopStatus::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--grn)}
main{max-width:620px;margin:0 auto;padding:76px 14px 96px}
.secTitle{font-size:15px;font-weight:800;margin:2px 0 10px;display:flex;align-items:center;gap:7px}
.secTitle .cnt{background:var(--gradient);color:#fff;border-radius:999px;padding:2px 9px;font-size:10px;font-weight:800}
.chatRow{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:8px;cursor:pointer;transition:.2s}
.chatRow:active{transform:scale(.98)}
.chatRow.fresh{border:2px solid rgba(255,107,107,.4)}
.chatAva{width:52px;height:52px;border-radius:50%;flex:none;background:linear-gradient(135deg,#FFE5E5,#F5E6FF);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--pink)}
.chatAva .icn{width:24px;height:24px}
.chatAva img{width:100%;height:100%;object-fit:cover}
.chatBody{flex:1;min-width:0}
.chatTop{display:flex;justify-content:space-between;gap:6px;align-items:center}
.chatName{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatTime{font-size:10px;color:var(--gray);flex:none}
.chatMsg{font-size:11.5px;color:var(--gray);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatMeta{flex:none}
.stPill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:9.5px;font-weight:800}
.s-new{background:var(--gradient);color:#fff;box-shadow:0 4px 12px rgba(255,107,107,.4)}
.s-accepted{background:rgba(245,158,11,.14);color:var(--yel)}
.s-ready{background:rgba(217,119,6,.14);color:var(--gold)}
.s-delivered{background:rgba(16,185,129,.14);color:var(--grn)}
.s-cancelled{background:rgba(148,163,184,.14);color:var(--gray);text-decoration:line-through}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;box-shadow:0 -4px 24px rgba(0,0,0,.08)}
.bnav button{flex:1;border:none;background:none;padding:9px 2px calc(9px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--gray);font-size:9.5px;font-weight:700;cursor:pointer;position:relative}
.bnav button .icn{width:20px;height:20px}
.bnav button.on{color:var(--coral)}
.bnav .nb{position:absolute;top:5px;right:calc(50% - 20px);min-width:15px;height:15px;border-radius:999px;background:var(--gradient);color:#fff;font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:54px;height:54px;border:none;border-radius:50%;background:var(--gradient);color:#fff;cursor:pointer;box-shadow:0 10px 30px rgba(255,107,107,.45);z-index:19;display:flex;align-items:center;justify-content:center}
.fab .icn{width:24px;height:24px}
.card{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);margin-bottom:10px}
input,textarea{width:100%;background:var(--bg);border:2px solid transparent;border-radius:12px;padding:11px;font-size:14px;margin-bottom:8px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--coral)}
.btn{width:100%;background:var(--gradient);color:#fff;border:none;border-radius:999px;padding:13px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.btn .icn{width:16px;height:16px}
.btn.soft{background:var(--bg);color:var(--ink)}
.btn.green{background:linear-gradient(135deg,#10B981,#059669)}
.btn.amber{background:linear-gradient(135deg,#F59E0B,#D97706)}
.btn.danger{background:#FFF1F0;color:var(--red)}
.rowBtns{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
.sheetIn{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:16px 14px 24px;max-height:88vh;overflow-y:auto;animation:rise .3s ease}
.sheetIn h3{font-size:16px;font-weight:800;margin-bottom:8px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hidden{display:none!important}
.empty{text-align:center;color:var(--gray);padding:30px;font-size:13px}
.bigIcn{width:44px;height:44px;color:var(--coral);opacity:.45;display:block;margin:0 auto 10px}
.oLine{font-size:13px;line-height:1.7;color:var(--gray);margin-bottom:4px}
.oLine b{color:var(--ink)}
.exRow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:8px}
.exRow .nm{flex:1;font-weight:700;font-size:13px}
.exRow .pr{font-weight:800;color:var(--coral);font-size:13px}
.delIco{border:none;background:#FFF1F0;color:var(--red);border-radius:999px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.delIco .icn{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:2px solid rgba(148,163,184,.25);background:var(--bg);border-radius:999px;padding:8px 12px;font-size:11.5px;font-weight:700;color:var(--gray);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.chip.on{border-color:var(--coral);background:var(--gradient);color:#fff}
.chip .x{margin-left:4px;font-weight:800;opacity:.7}
.backBtn{width:36px;height:36px;border:none;border-radius:50%;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;box-shadow:var(--shadow)}
.backBtn .icn{width:18px;height:18px}
.bqRow{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:8px}
.bqRow .ph{width:52px;height:52px;border-radius:14px;flex:none;background:linear-gradient(135deg,#FFE5E5,#F5E6FF);display:flex;align-items:center;justify-content:center;color:var(--pink);overflow:hidden}
.bqRow .ph .icn{width:24px;height:24px}
.bqRow .inf{flex:1;min-width:0}
.bqRow .tt{font-weight:800;font-size:13px;display:flex;align-items:center;gap:4px}
.bqRow .tt .icn{width:13px;height:13px;color:var(--yel)}
.bqRow .pp{color:var(--coral);font-weight:800;font-size:12.5px}
.bqRow .tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.bqRow .tags span{font-size:9px;background:rgba(255,107,107,.1);color:var(--coral);padding:2px 6px;border-radius:999px;font-weight:700}
.icn{width:1.05em;height:1.05em;display:inline-block;vertical-align:-.15em;flex:none}
.fieldLbl{font-size:11px;color:var(--gray);margin:4px 0 6px;display:flex;align-items:center;gap:5px}
.fieldLbl .icn{width:13px;height:13px;color:var(--coral)}
.tagInputRow{display:flex;gap:6px;margin-bottom:8px}
.tagInputRow input{margin:0;flex:1}
.tagInputRow button{width:42px;flex:none;border:none;background:var(--gradient);color:#fff;border-radius:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tagInputRow button .icn{width:16px;height:16px}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(30,41,59,.95);color:#F1F5F9;border:2px solid rgba(255,107,107,.4);border-radius:16px;font-weight:700;font-size:13px;padding:12px 20px;text-align:center;max-width:82vw;z-index:99}
#toast:not(.hidden){animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<symbol id="i-box" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 2l9 4.5v11L12 22l-9-4.5v-11z"/><path d="M12 12l9-4.5M12 12L3 7.5M12 12v10"/></g></symbol>
<symbol id="i-flower" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2 3.5 4 .5-3 3 .5 4L12 11l-3.5 2 .5-4-3-3 4-.5zM4 14c0 5 4 8 8 8s8-3 8-8c0-2-2-3-4-3-2 0-4 1-4 1s-2-1-4-1-4 1-4 3z"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8l2.6 5.6 6 .7-4.5 4.1 1.2 5.9L12 16.2l-5.3 2.9 1.2-5.9L3.4 9.1l6-.7z"/></symbol>
<symbol id="i-comment" viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16v12H9l-5 4z"/></symbol>

<symbol id="i-camera" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></g></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><path fill="currentColor" d="M6 3h4l1 5-2.5 1.5a12 12 0 0 0 6 6L16 13l5 1v4a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2z"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M4 12.5l5 5L20 6.5"/></symbol>
<symbol id="i-truck" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M2 6h12v10H2z"/><path d="M14 9h4l3 3v4h-7z"/><circle cx="6" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></g></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></g></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 20h4L20 8l-4-4L4 16z"/><path d="M13 7l4 4"/></g></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></symbol>
<symbol id="i-tag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor"/></g></symbol>
</svg>
<div class="top">
  <div class="topIn">
    <button class="backBtn" onclick="location.href='./'"><svg class="icn"><use href="#i-back"/></svg></button>
    <div class="shopAva" id="shopAva"><svg class="icn"><use href="#i-flower"/></svg></div>
    <div>
      <div class="shopName" id="shopName">Цветочная лавка</div>
      <div class="shopStatus">кабинет продавца</div>
    </div>
  </div>
</div>
<main>
  <section id="sec-orders">
    <div class="secTitle">Заказы <span class="cnt" id="cntOrders">0</span></div>
    <div id="orderList"></div>
  </section>
  <section id="sec-bouquets" class="hidden">
    <div class="secTitle">Мои букеты <span class="cnt" id="cntBouq">0</span></div>
    <div id="bouqList"></div>
  </section>
  <section id="sec-extras" class="hidden">
    <div class="secTitle">Допы к букетам</div>
    <div class="card"><input id="exName" placeholder="Название (Открытка с вашими словами)"><input id="exPrice" type="number" placeholder="Цена в рублях (0 = бесплатно)"><button class="btn" onclick="addExtra()"><svg class="icn"><use href="#i-plus"/></svg>Добавить доп</button></div>
    <div id="extraList"></div>
  </section>
  <section id="sec-reviews" class="hidden">
    <div class="secTitle">Отзывы <span class="cnt" id="cntRev">0</span></div>
    <div id="revList"></div>
  </section>
  <section id="sec-shop" class="hidden">
    <div class="secTitle">Мой магазин</div>
    <div class="card">
      <input id="shName" placeholder="Название магазина">
      <input id="shPhone" placeholder="Телефон">
      <input id="shAddr" placeholder="Адрес">
      <textarea id="shDesc" placeholder="Описание"></textarea>
      <button class="btn soft" onclick="document.getElementById('shLogo').click()"><svg class="icn"><use href="#i-camera"/></svg>Логотип</button>
      <input type="file" id="shLogo" accept="image/*" style="display:none" onchange="pickLogo(this)">
      <div id="lPrevWrap" class="hidden" style="margin:8px 0"><img id="lPrev" style="width:64px;height:64px;object-fit:cover;border-radius:50%;box-shadow:var(--shadow)"></div>
      <button class="btn" style="margin-top:8px" onclick="saveShop()">Сохранить</button>
    </div>
    <button class="btn danger" onclick="logout()">Выйти</button>
  </section>
</main>
<button class="fab hidden" id="fabBouq" onclick="openAddBouquet()"><svg class="icn"><use href="#i-plus"/></svg></button>
<nav class="bnav">
  <button class="on" id="nvOrders" onclick="showSec('orders')"><svg class="icn"><use href="#i-box"/></svg>Заказы<span class="nb hidden" id="nbOrders"></span></button>
  <button id="nvBouquets" onclick="showSec('bouquets')"><svg class="icn"><use href="#i-flower"/></svg>Букеты</button>
  <button id="nvExtras" onclick="showSec('extras')"><svg class="icn"><use href="#i-star"/></svg>Допы</button>
  <button id="nvReviews" onclick="showSec('reviews')"><svg class="icn"><use href="#i-comment"/></svg>Отзывы</button>
  <button id="nvShop" onclick="showSec('shop')"><svg class="icn"><use href="#i-shop"/></svg>Магазин</button>
</nav>
<div id="orderSheet" class="sheet hidden" onclick="if(event.target.id==='orderSheet')closeSheet('orderSheet')"><div class="sheetIn" id="orderBody"></div></div>
<div id="bouqSheet" class="sheet hidden" onclick="if(event.target.id==='bouqSheet')closeSheet('bouqSheet')"><div class="sheetIn" id="bouqBody"></div></div>
<div id="loginBox" class="sheet" style="align-items:center;background:var(--bg)">
  <div class="sheetIn" style="border-radius:24px;max-width:420px;margin:0 16px">
    <h3>Вход для продавца</h3>
    <input id="email" type="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Пароль">
    <button class="btn" onclick="doLogin()">Войти</button>
    <div id="loginErr" style="color:var(--red);font-size:12px;margin-top:6px"></div>
  </div>
</div>
<div id="toast" class="hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://dhwkkbtrhexywymegwoo.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRod2trYnRyaGV4eXd5bWVnd29vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDUxODMsImV4cCI6MjEwMzc4MTE4M30.NAyY4dCeRRC2OznENuNCfvr-mKqACyMU61K-y-PkRIQ');
let me=null,shop=null,myBouquets=[],myOrders=[],myReviews=[],myExtras=[],pickedPhoto=null,pickedLogo=null;
function $(id){return document.getElementById(id);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ic(n){return '<svg class="icn"><use href="#'+n+'"/></svg>';}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add('hidden'),2400);}
function closeSheet(id){$(id).classList.add('hidden');}
function whenRu(t){try{return new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function statusRu(s){return({new:'новый',accepted:'принят',ready:'готов',delivered:'доставлен',cancelled:'отменён'})[s]||s;}

// предустановленные теги для AI-подбора "собери мне"
const TAG_PRESETS=[
  'день рождения','свидание','просто так','8 марта','извинение',
  'выпускной','1 сентября','день учителя','день матери','новый год','14 февраля',
  'маме','подруге','девушке','жене','коллеге','себе','учителю','бабушке',
  'до 2500','2500-4000','4000+'
];
let pickedTags=[];

async function boot(){
  const {data}=await sb.auth.getSession();
  if(!data.session){return;}
  me=data.session.user;
  const pr=await sb.from('profiles').select('is_florist').eq('id',me.id).maybeSingle();
  if(!pr.data||!pr.data.is_florist){return;}
  $('loginBox').classList.add('hidden');
  await refresh();
}
async function doLogin(){
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});
  if(error){$('loginErr').textContent='Неверный email или пароль';return;}
  location.reload();
}
async function logout(){await sb.auth.signOut();location.reload();}
async function refresh(){
  const sh=await sb.from('shops').select('*').eq('owner_id',me.id).maybeSingle();
  shop=sh.data||null;
  if(shop){
    $('shopName').textContent=shop.name;
    if(shop.logo_url)$('shopAva').innerHTML='<img src="'+shop.logo_url+'">';
    $('shName').value=shop.name||'';$('shPhone').value=shop.phone||'';$('shAddr').value=shop.address||'';$('shDesc').value=shop.description||'';
    const ex=await sb.from('shop_extras').select('*').eq('shop_id',shop.id).order('created_at');
    myExtras=ex.data||[];
  }
  const b=await sb.from('bouquets').select('*').eq('user_id',me.id).order('created_at',{ascending:false});
  myBouquets=b.data||[];
  const ids=myBouquets.map(x=>x.id);
  if(ids.length){
    const o=await sb.from('orders').select('*').in('bouquet_id',ids).order('created_at',{ascending:false});
    myOrders=o.data||[];
    const r=await sb.from('bouquet_comments').select('*').in('bouquet_id',ids).order('created_at',{ascending:false});
    myReviews=r.data||[];
  }else{myOrders=[];myReviews=[];}
  const fresh=myOrders.filter(o=>o.status==='new').length;
  $('cntOrders').textContent=myOrders.length;
  $('cntBouq').textContent=myBouquets.length;
  $('cntRev').textContent=myReviews.length;
  if(fresh>0){$('nbOrders').classList.remove('hidden');$('nbOrders').textContent=fresh;}else{$('nbOrders').classList.add('hidden');}
  renderOrders();renderBouquets();renderExtras();renderReviews();
}
function showSec(s){
  ['orders','bouquets','extras','reviews','shop'].forEach(k=>$('sec-'+k).classList.toggle('hidden',k!==s));
  ['Orders','Bouquets','Extras','Reviews','Shop'].forEach(k=>$('nv'+k).classList.toggle('on',k.toLowerCase()===s));
  $('fabBouq').classList.toggle('hidden',s!=='bouquets');
}
function renderOrders(){
  const box=$('orderList');
  box.innerHTML=myOrders.length?myOrders.map(o=>{
    const b=myBouquets.find(x=>x.id===o.bouquet_id);
    const name=o.recipient_name||o.sender_name||'Клиент';
    return '<div class="chatRow'+(o.status==='new'?' fresh':'')+'" onclick="openOrder('+o.id+')">'+
      '<div class="chatAva">'+(b&&b.photo_url?'<img src="'+b.photo_url+'">':ic('i-flower'))+'</div>'+
      '<div class="chatBody"><div class="chatTop"><span class="chatName">'+esc(name)+'</span><span class="chatTime">'+whenRu(o.created_at)+'</span></div>'+
      '<div class="chatMsg">'+esc(b?b.title:'Букет')+' · '+((b?b.price:'?')+' ₽')+' · '+(o.kind==='delivery'?'доставка':'самовывоз')+'</div></div>'+
      '<div class="chatMeta"><span class="stPill s-'+o.status+'">'+statusRu(o.status)+'</span></div></div>';
  }).join(''):'<div class="empty">'+icBig('i-box')+'Пока нет заказов.<br>Как только кто-то закажет — он появится здесь</div>';
}
function icBig(n){return '<svg class="bigIcn"><use href="#'+n+'"/></svg>';}
function openOrder(id){
  const o=myOrders.find(x=>x.id===id);if(!o)return;
  const b=myBouquets.find(x=>x.id===o.bouquet_id);
  let exHtml='';
  if(o.extras&&o.extras.length){exHtml='<div class="oLine">Допы: <b>'+o.extras.map(e=>esc(e.name)+(e.price?' ('+e.price+' ₽)':'')).join(', ')+'</b></div>';}
  const phone=o.recipient_phone||o.sender_phone;
  $('orderBody').innerHTML='<h3>'+esc(b?b.title:'Букет')+' · '+(b?b.price+' ₽':'')+'</h3>'+
    '<div class="oLine">Получатель: <b>'+esc(o.recipient_name||o.sender_name||'—')+'</b></div>'+
    (phone?'<div class="oLine">Телефон: <b>'+esc(phone)+'</b></div>':'')+
    (o.address?'<div class="oLine">Адрес: <b>'+esc(o.address)+'</b></div>':'')+
    (o.sender_name&&o.recipient_name?'<div class="oLine">Заказчик: <b>'+esc(o.sender_name)+'</b>'+(o.sender_phone?' · '+esc(o.sender_phone):'')+'</div>':'')+
    (o.note?'<div class="oLine">Комментарий: <i>'+esc(o.note)+'</i></div>':'')+
    exHtml+
    '<div class="oLine" style="margin-top:6px">Статус: <span class="stPill s-'+o.status+'">'+statusRu(o.status)+'</span></div>'+
    '<div class="rowBtns">'+
      (phone?'<button class="btn" onclick="call(\''+esc(phone)+'\')">'+ic('i-phone')+'Позвонить</button>':'')+
      (o.status==='new'?'<button class="btn green" onclick="setStatus('+o.id+',\'accepted\')">'+ic('i-check')+'Принять заказ</button>':'')+
      (o.status==='accepted'?'<button class="btn amber" onclick="setStatus('+o.id+',\'ready\')">'+ic('i-flower')+'Готов</button>':'')+
      (o.status==='ready'?'<button class="btn green" onclick="setStatus('+o.id+',\'delivered\')">'+ic('i-truck')+'Доставлен</button>':'')+
      (o.status!=='delivered'&&o.status!=='cancelled'?'<button class="btn danger" onclick="setStatus('+o.id+',\'cancelled\')">'+ic('i-x')+'Отменить</button>':'')+
      '<button class="btn soft" onclick="closeSheet(\'orderSheet\')">Закрыть</button>'+
    '</div>';
  $('orderSheet').classList.remove('hidden');
}
function call(p){window.location.href='tel:'+p.replace(/\D/g,'');}
async function setStatus(id,st){
  const res=await sb.from('orders').update({status:st}).eq('id',id).select();
  if(res.error){toast('Ошибка: '+res.error.message);return;}
  closeSheet('orderSheet');
  await refresh();
}
function getTags(b){return Array.isArray(b.tags)?b.tags:(b.tags?String(b.tags).split(',').filter(Boolean):[]);}
function renderBouquets(){
  const box=$('bouqList');
  box.innerHTML=myBouquets.length?myBouquets.map(b=>{
    const tags=getTags(b);
    const tagsHtml=tags.length?'<div class="tags">'+tags.slice(0,4).map(t=>'<span>'+esc(t)+'</span>').join('')+(tags.length>4?'<span>+'+(tags.length-4)+'</span>':'')+'</div>':'';
    return '<div class="bqRow"><div class="ph">'+(b.photo_url?'<img src="'+b.photo_url+'" style="width:100%;height:100%;object-fit:cover">':ic('i-flower'))+'</div>'+
    '<div class="inf"><div class="tt">'+esc(b.title)+(b.is_day?ic('i-star'):'')+'</div><div class="pp">'+b.price+' ₽ · '+(b.in_stock?'в наличии':'под заказ')+'</div>'+tagsHtml+'</div>'+
    '<button class="delIco" style="background:var(--bg);color:var(--gray)" onclick="openEditBouquet('+b.id+')">'+ic('i-edit')+'</button><button class="delIco" onclick="delBouquet('+b.id+')">'+ic('i-trash')+'</button></div>';
  }).join(''):'<div class="empty">'+icBig('i-flower')+'Пока нет букетов.<br>Нажми ＋ чтобы добавить</div>';
}
function renderTagChips(){
  const row=$('fTagRow');if(!row)return;
  // чипсы из пресетов + свои
  const all=[...new Set([...TAG_PRESETS,...pickedTags])];
  row.innerHTML=all.map(t=>{
    const on=pickedTags.includes(t);
    const isCustom=!TAG_PRESETS.includes(t);
    return '<button type="button" class="chip'+(on?' on':'')+'" onclick="toggleTag(this,\''+esc(t).replace(/'/g,"\\'")+'\')">'+esc(t)+(isCustom&&on?'<span class="x">×</span>':'')+'</button>';
  }).join('');
}
function toggleTag(el,t){
  const i=pickedTags.indexOf(t);
  if(i>=0){pickedTags.splice(i,1);}
  else{pickedTags.push(t);}
  renderTagChips();
}
function addCustomTag(){
  const inp=$('fNewTag');if(!inp)return;
  const t=inp.value.trim().toLowerCase();
  if(!t)return;
  if(pickedTags.includes(t)){inp.value='';return;}
  pickedTags.push(t);
  inp.value='';
  renderTagChips();
}
function openAddBouquet(){
  pickedPhoto=null;pickedCat='';editingId=null;pickedTags=[];
  $('bouqBody').innerHTML='<h3 id="bouqHead">Новый букет</h3>'+
    '<input id="fTitle" placeholder="Название">'+
    '<input id="fPrice" type="number" placeholder="Цена в рублях">'+
    '<div class="fieldLbl">'+ic('i-tag')+'Категория</div>'+
    '<div class="chips" id="fCatRow">'+['сборный','розы','тюльпаны','хризантемы','пионы','лилии','композиция'].map(c=>'<button type="button" class="chip" onclick="pickCat(this,\''+c+'\')">'+c+'</button>').join('')+'</div>'+
    '<div class="fieldLbl">'+ic('i-wand')+'Теги для «Собери мне» <span style="color:var(--gray);font-weight:400;font-size:10px">(выбери повод, кому и бюджет — AI подберёт этот букет)</span></div>'+
    '<div class="chips" id="fTagRow"></div>'+
    '<div class="tagInputRow"><input id="fNewTag" placeholder="свой тег (например: для мамы)" onkeypress="if(event.key===\'Enter\'){event.preventDefault();addCustomTag();}"><button type="button" onclick="addCustomTag()">'+ic('i-plus')+'</button></div>'+
    '<div class="fieldLbl">'+ic('i-doc')+'Описание</div>'+
    '<textarea id="fDesc" placeholder="Что входит в букет"></textarea>'+
    '<button class="btn soft" onclick="document.getElementById(\'fPhoto\').click()">'+ic('i-camera')+'Фото</button>'+
    '<input type="file" id="fPhoto" accept="image/*" style="display:none" onchange="pickPhoto(this)">'+
    '<div id="fPrevWrap" class="hidden" style="margin:8px 0"><img id="fPrev" style="width:84px;height:84px;object-fit:cover;border-radius:14px;box-shadow:var(--shadow)"></div>'+
    '<span id="fPhotoName" style="font-size:11px;color:var(--gray)"></span>'+
    '<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:8px 0"><input type="checkbox" id="fStock" checked style="width:auto;margin:0"> В наличии</label>'+
    '<button class="btn" id="bouqSaveBtn" onclick="submitBouquet()">Сохранить</button>'+
    '<button class="btn soft" style="margin-top:8px" onclick="closeSheet(\'bouqSheet\')">Закрыть</button>';
  renderTagChips();
  $('bouqSheet').classList.remove('hidden');
}
let pickedCat='';
function pickCat(el,c){pickedCat=c;document.querySelectorAll('#fCatRow .chip').forEach(x=>x.classList.toggle('on',x.textContent===c));}
let editingId=null;
function openEditBouquet(id){
  const b=myBouquets.find(x=>x.id===id);if(!b)return;
  openAddBouquet();
  editingId=id;
  $('fTitle').value=b.title;$('fPrice').value=b.price;$('fDesc').value=b.description||'';$('fStock').checked=b.in_stock;
  pickedCat=b.category||'';
  document.querySelectorAll('#fCatRow .chip').forEach(x=>x.classList.toggle('on',x.textContent===pickedCat));
  pickedTags=getTags(b);
  renderTagChips();
  if(b.photo_url){$('fPrev').src=b.photo_url;$('fPrevWrap').classList.remove('hidden');}
  $('bouqHead').textContent='Редактировать букет';
  $('bouqSaveBtn').textContent='Сохранить изменения';
}
function pickPhoto(inp){const f=inp.files[0];if(!f)return;pickedPhoto=f;$('fPhotoName').textContent='Файл: '+f.name.slice(0,20);const r=new FileReader();r.onload=e=>{$('fPrev').src=e.target.result;$('fPrevWrap').classList.remove('hidden');};r.readAsDataURL(f);}
async function submitBouquet(){
  const t=$('fTitle').value.trim(),p=+$('fPrice').value;
  if(!t||!p){toast('Заполни название и цену');return;}
  let photo_url=null;
  if(pickedPhoto){
    const path=me.id+'/'+Date.now()+'.jpg';
    const up=await sb.storage.from('bouquets').upload(path,pickedPhoto,{contentType:pickedPhoto.type});
    if(up.error){toast('Фото: '+up.error.message);return;}
    photo_url=sb.storage.from('bouquets').getPublicUrl(path).data.publicUrl;
  }
  if(editingId){
    const upd={title:t,price:p,description:$('fDesc').value.trim(),category:pickedCat,tags:pickedTags,in_stock:$('fStock').checked};
    if(photo_url)upd.photo_url=photo_url;
    const res=await sb.from('bouquets').update(upd).eq('id',editingId).eq('user_id',me.id);
    if(res.error){toast('Ошибка: '+res.error.message);return;}
    toast('Букет обновлён');
  }else{
    const res=await sb.from('bouquets').insert({title:t,price:p,description:$('fDesc').value.trim(),category:pickedCat,tags:pickedTags,photo_url,in_stock:$('fStock').checked,user_id:me.id});
    if(res.error){toast('Ошибка: '+res.error.message);return;}
    toast('Букет добавлен');
  }
  closeSheet('bouqSheet');
  await refresh();
}
async function delBouquet(id){
  if(!confirm('Удалить букет?'))return;
  const res=await sb.from('bouquets').delete().eq('id',id).eq('user_id',me.id);
  if(res.error){toast('Ошибка: '+res.error.message);return;}
  await refresh();
}
function renderExtras(){
  const box=$('extraList');
  box.innerHTML=myExtras.length?myExtras.map(e=>
    '<div class="exRow"><div class="nm">'+esc(e.name)+'</div><div class="pr">'+(e.price?e.price+' ₽':'бесплатно')+'</div><button class="delIco" onclick="delExtra('+e.id+')">'+ic('i-trash')+'</button></div>'
  ).join(''):'<div class="empty">'+icBig('i-star')+'Допов пока нет.<br>Добавь первый — например «Открытка»</div>';
}
async function addExtra(){
  if(!shop){toast('Сначала заполни магазин');return;}
  const n=$('exName').value.trim(),p=+$('exPrice').value||0;
  if(!n){toast('Введи название допа');return;}
  const res=await sb.from('shop_extras').insert({shop_id:shop.id,name:n,price:p});
  if(res.error){toast('Ошибка: '+res.error.message);return;}
  $('exName').value='';$('exPrice').value='';
  await refresh();
  toast('Доп добавлен');
}
async function delExtra(id){
  const res=await sb.from('shop_extras').delete().eq('id',id);
  if(res.error){toast('Ошибка: '+res.error.message);return;}
  await refresh();
}
function renderReviews(){
  const box=$('revList');
  const ids=myBouquets.map(b=>b.id);
  const list=myReviews.filter(c=>ids.includes(c.bouquet_id));
  box.innerHTML=list.length?list.map(c=>{
    const b=myBouquets.find(x=>x.id===c.bouquet_id);
    return '<div class="card"><div style="font-size:11px;color:var(--gray)">'+whenRu(c.created_at)+' · <b>'+esc(c.user_nick||'аноним')+'</b>'+(c.rating?' · '+c.rating+'/5':'')+'</div>'+
      (b?'<div style="font-size:11px;color:var(--coral);margin-top:2px">к букету: '+esc(b.title)+'</div>':'')+
      '<div style="font-size:13.5px;margin-top:6px;line-height:1.5">'+esc(c.text)+'</div></div>';
  }).join(''):'<div class="empty">'+icBig('i-comment')+'Отзывов пока нет</div>';
}
function pickLogo(inp){const f=inp.files[0];if(!f)return;pickedLogo=f;const r=new FileReader();r.onload=e=>{$('lPrev').src=e.target.result;$('lPrevWrap').classList.remove('hidden');};r.readAsDataURL(f);}
async function saveShop(){
  if(!shop){toast('Магазин не найден');return;}
  let logo_url=shop.logo_url;
  if(pickedLogo){
    const path=me.id+'/logo_'+Date.now()+'.jpg';
    const up=await sb.storage.from('bouquets').upload(path,pickedLogo,{contentType:pickedLogo.type});
    if(up.error){toast('Лого: '+up.error.message);return;}
    logo_url=sb.storage.from('bouquets').getPublicUrl(path).data.publicUrl;
  }
  const res=await sb.from('shops').update({name:$('shName').value.trim(),phone:$('shPhone').value.trim(),address:$('shAddr').value.trim(),description:$('shDesc').value.trim(),logo_url}).eq('id',shop.id);
  if(res.error){toast('Ошибка: '+res.error.message);return;}
  pickedLogo=null;
  await refresh();
  toast('Магазин сохранён');
}
boot();
</script>
</body>
</html>
