<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лепесток · кабинет продавца</title>
<link href="https://fonts.cdnfonts.com/css/opposans" rel="stylesheet">
<style>
:root{--bg:#FFF7F5;--card:#FFFFFF;--ink:#1A1A2E;--gray:#94A3B8;--red:#EF4444;--yel:#F59E0B;--grn:#10B981;--gold:#D97706;--coral:#FF6B6B;--pink:#FF6B9D;--purple:#A855F7;--gradient:linear-gradient(135deg,#FF6B6B 0%,#FF6B9D 50%,#A855F7 100%);--glass:rgba(255,255,255,.9);--shadow:0 6px 20px rgba(120,60,10,.08)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'OPPO Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(160deg,#FFF7F5 0%,#FFEDEB 45%,#F6ECFF 100%);color:var(--ink);min-height:100vh}
.top{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 4px 24px rgba(0,0,0,.06)}
.topIn{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px}
.shopAva{width:44px;height:44px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;box-shadow:0 6px 18px rgba(255,107,107,.35);color:#fff}
.shopAva .icn{width:22px;height:22px}
.shopAva img{width:100%;height:100%;object-fit:cover}
.shopName{font-weight:800;font-size:15px}
.shopStatus{font-size:10.5px;color:var(--grn);font-weight:700;display:flex;align-items:center;gap:4px}
.shopStatus::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--grn)}
.shopStatus.warn{color:var(--gold)}
.shopStatus.warn::before{background:var(--gold)}
main{max-width:620px;margin:0 auto;padding:76px 14px 96px}
.secTitle{font-size:15px;font-weight:800;margin:2px 0 10px;display:flex;align-items:center;gap:7px}
.secTitle .cnt{background:var(--gradient);color:#fff;border-radius:999px;padding:2px 9px;font-size:10px;font-weight:800}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;box-shadow:0 -4px 24px rgba(0,0,0,.08)}
.bnav button{flex:1;border:none;background:none;padding:9px 2px calc(9px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--gray);font-size:9.5px;font-weight:700;cursor:pointer;position:relative}
.bnav button .icn{width:20px;height:20px}
.bnav button.on{color:var(--coral)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:54px;height:54px;border:none;border-radius:50%;background:var(--gradient);color:#fff;cursor:pointer;box-shadow:0 10px 30px rgba(255,107,107,.45);z-index:19;display:flex;align-items:center;justify-content:center}
.fab .icn{width:24px;height:24px}
.card{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);margin-bottom:10px}
input,textarea{width:100%;background:var(--bg);border:2px solid transparent;border-radius:12px;padding:11px;font-size:14px;margin-bottom:8px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--coral)}
.btn{width:100%;background:var(--gradient);color:#fff;border:none;border-radius:999px;padding:13px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.2s}
.btn:active{transform:scale(.98)}
.btn .icn{width:16px;height:16px}
.btn.soft{background:var(--bg);color:var(--ink)}
.btn.danger{background:#FFF1F0;color:var(--red)}
.rowBtns{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
.sheetIn{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:16px 14px 24px;max-height:88vh;overflow-y:auto;animation:rise .3s ease}
.sheetIn h3{font-size:16px;font-weight:800;margin-bottom:8px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hidden{display:none!important}
.empty{text-align:center;color:var(--gray);padding:30px;font-size:13px}
.bigIcn{width:44px;height:44px;color:var(--coral);opacity:.45;display:block;margin:0 auto 10px}
.fieldLbl{font-size:11px;color:var(--gray);margin:4px 0 6px;display:flex;align-items:center;gap:5px}
.fieldLbl .icn{width:13px;height:13px;color:var(--coral)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:2px solid rgba(148,163,184,.25);background:var(--bg);border-radius:999px;padding:8px 12px;font-size:11.5px;font-weight:700;color:var(--gray);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.chip.on{border-color:var(--coral);background:var(--gradient);color:#fff}
.chip .x{margin-left:4px;font-weight:800;opacity:.7}
.backBtn{width:36px;height:36px;border:none;border-radius:50%;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;box-shadow:var(--shadow)}
.backBtn .icn{width:18px;height:18px}
.bqRow{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:8px}
.bqRow .ph{width:52px;height:52px;border-radius:14px;flex:none;background:linear-gradient(135deg,#FFE5E5,#F5E6FF);display:flex;align-items:center;justify-content:center;color:var(--pink);overflow:hidden}
.bqRow .ph img{width:100%;height:100%;object-fit:cover}
.bqRow .ph .icn{width:24px;height:24px}
.bqRow .inf{flex:1;min-width:0}
.bqRow .tt{font-weight:800;font-size:13px;display:flex;align-items:center;gap:4px}
.bqRow .tt .icn{width:13px;height:13px;color:var(--yel)}
.bqRow .pp{color:var(--coral);font-weight:800;font-size:12.5px}
.bqRow .tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.bqRow .tags span{font-size:9px;background:rgba(255,107,107,.1);color:var(--coral);padding:2px 6px;border-radius:999px;font-weight:700}
.delIco{border:none;background:#FFF1F0;color:var(--red);border-radius:999px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.delIco .icn{width:15px;height:15px}
.icn{width:1.05em;height:1.05em;display:inline-block;vertical-align:-.15em;flex:none}
.tagInputRow{display:flex;gap:6px;margin-bottom:8px}
.tagInputRow input{margin:0;flex:1}
.tagInputRow button{width:42px;flex:none;border:none;background:var(--gradient);color:#fff;border-radius:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tagInputRow button .icn{width:16px;height:16px}
.trendBlock{background:linear-gradient(120deg,#FFF3F1 0%,#FFECEF 100%);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);border:1px dashed rgba(255,107,107,.35)}
.trendBlock h4{font-size:12.5px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:var(--coral)}
.trendBlock h4 .icn{width:14px;height:14px}
.trendBlock .trendSub{font-size:10.5px;color:var(--gray);margin-bottom:8px;line-height:1.4}
.trendChips{display:flex;flex-wrap:wrap;gap:5px}
.trendChip{background:var(--card);border:1.5px solid rgba(255,107,107,.3);color:var(--coral);border-radius:999px;padding:5px 10px;font-size:10.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.trendChip .cnt{font-size:9px;background:rgba(255,107,107,.14);color:var(--coral);padding:1px 6px;border-radius:999px;font-weight:800}
.trendChip.added{opacity:.5;cursor:default;border-style:dotted}
.statsGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.statCard{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.statCard .lbl{font-size:9.5px;color:var(--gray);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.statCard .val{font-size:22px;font-weight:800;margin-top:3px;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.statCard .sub{font-size:9.5px;color:var(--gray);margin-top:2px}
.chRow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed rgba(255,107,107,.15);font-size:12px}
.chRow:last-child{border:none}
.chRow .chIco{width:28px;height:28px;border-radius:9px;background:rgba(255,107,107,.12);color:var(--coral);display:grid;place-items:center;flex:none}
.chRow .chIco .icn{width:14px;height:14px}
.chRow .chNm{flex:1;font-weight:700}
.chRow .chBar{width:70px;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;flex:none}
.chRow .chBar i{display:block;height:100%;background:var(--gradient);border-radius:3px}
.chRow .chNum{width:30px;text-align:right;font-weight:800;color:var(--coral);flex:none}
.revRow{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);margin-bottom:8px}
.revHead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.revAva{width:32px;height:32px;border-radius:50%;background:var(--gradient);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.revNick{font-weight:800;font-size:12px;flex:1}
.revDate{font-size:10px;color:var(--gray)}
.revBq{font-size:10px;color:var(--coral);margin-bottom:4px;font-weight:700}
.revText{font-size:13px;line-height:1.5;color:var(--ink);margin-bottom:8px}
.revStars{display:flex;gap:1px;margin-bottom:6px}
.revStars .icn{width:13px;height:13px}
.replyChain{border-left:2px solid rgba(255,107,107,.2);padding-left:10px;margin:6px 0}
.replyItem{background:linear-gradient(120deg,#FFF3F1,#FFECEF);border-radius:10px;padding:8px 10px;margin-bottom:4px;font-size:12px;line-height:1.4}
.replyItem .rpNick{font-weight:800;font-size:10px;color:var(--coral);margin-bottom:2px}
.replyInput{display:flex;gap:6px;margin-top:8px}
.replyInput input{margin:0;flex:1;padding:9px 12px;font-size:12px}
.replyInput button{width:42px;flex:none;border:none;background:var(--gradient);color:#fff;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.replyInput button .icn{width:14px;height:14px}
.qrBlock{background:var(--card);border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:var(--shadow)}
.qrBlock h4{font-size:11px;font-weight:800;margin-bottom:6px;color:var(--coral);display:flex;align-items:center;gap:5px}
.qrChips{display:flex;flex-wrap:wrap;gap:5px}
.qrChip{background:var(--bg);border:1.5px solid rgba(148,163,184,.25);border-radius:999px;padding:5px 9px;font-size:10.5px;font-weight:700;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.qrChip .rm{color:var(--red);font-weight:800;opacity:.7}
.qrAdd{display:flex;gap:5px;margin-top:6px}
.qrAdd input{margin:0;flex:1;padding:8px 10px;font-size:11px}
.qrAdd button{width:36px;flex:none;border:none;background:var(--gradient);color:#fff;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qrAdd button .icn{width:13px;height:13px}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(30,41,59,.95);color:#F1F5F9;border:2px solid rgba(255,107,107,.4);border-radius:16px;box-shadow:0 12px 48px rgba(255,107,107,.3);font-weight:700;font-size:13px;padding:12px 20px;text-align:center;max-width:82vw;z-index:99}
#toast .icn{width:15px;height:15px;margin-right:6px;vertical-align:-2px;color:var(--pink)}
#toast:not(.hidden){animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.loader{position:fixed;inset:0;z-index:200;background:rgba(255,255,255,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;pointer-events:all}
.loader .spin{width:42px;height:42px;border:3px solid rgba(255,107,107,.2);border-top-color:var(--coral);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.verTag{font-size:9px;color:var(--gray);font-weight:400;margin-left:6px}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<symbol id="i-box" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 2l9 4.5v11L12 22l-9-4.5v-11z"/><path d="M12 12l9-4.5M12 12L3 7.5M12 12v10"/></g></symbol>
<symbol id="i-flower" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2 3.5 4 .5-3 3 .5 4L12 11l-3.5 2 .5-4-3-3 4-.5zM4 14c0 5 4 8 8 8s8-3 8-8c0-2-2-3-4-3-2 0-4 1-4 1s-2-1-4-1-4 1-4 3z"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8l2.6 5.6 6 .7-4.5 4.1 1.2 5.9L12 16.2l-5.3 2.9 1.2-5.9L3.4 9.1l6-.7z"/></symbol>
<symbol id="i-comment" viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16v12H9l-5 4z"/></symbol>
<symbol id="i-shop" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9h18v11H3zM6 6h12l2 3H4z"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></g></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M4 12.5l5 5L20 6.5"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></g></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 20h4L20 8l-4-4L4 16z"/><path d="M13 7l4 4"/></g></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></symbol>
<symbol id="i-tag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor"/></g></symbol>
<symbol id="i-trend" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></g></symbol>
<symbol id="i-wand" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20l9.5-9.5"/><path fill="currentColor" stroke="none" d="M15.5 3l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z"/><path fill="currentColor" stroke="none" d="M19.5 12l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/><path fill="currentColor" stroke="none" d="M8 3l.7 1.8 1.8.7-1.8.7L8 8l-.7-1.8-1.8-.7 1.8-.7z"/></g></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></g></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></g></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><path fill="currentColor" d="M6 3h4l1 5-2.5 1.5a12 12 0 0 0 6 6L16 13l5 1v4a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2z"/></symbol>
<symbol id="i-telegram" viewBox="0 0 24 24"><path fill="currentColor" d="M21.9 4.3l-3.2 15.2c-.2 1.1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.4 13.3l-4.9-1.5c-1.1-.3-1.1-1.1.2-1.6L20.6 2.7c.9-.3 1.6.2 1.3 1.6z"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></g></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7.2 7.2 0 0 1 7.2 7.2c0 5.2-7.2 12.8-7.2 12.8S4.8 14.4 4.8 9.2A7.2 7.2 0 0 1 12 2z"/><circle cx="12" cy="9.2" r="2.6" fill="#fff"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="M13 6l6 6-6 6"/></g></symbol>
<symbol id="i-doc" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></g></symbol>
<symbol id="i-exit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v16h-6"/><path d="M3 12h11"/><path d="M10 8l4 4-4 4"/></g></symbol>
<symbol id="i-truck" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M2 6h12v10H2z"/><path d="M14 9h4l3 3v4h-7z"/><circle cx="6" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></g></symbol>
</svg>
<div class="top">
  <div class="topIn">
    <button class="backBtn" onclick="location.href='./'"><svg class="icn"><use href="#i-back"/></svg></button>
    <div class="shopAva" id="shopAva"><svg class="icn"><use href="#i-flower"/></svg></div>
    <div>
      <div class="shopName" id="shopName">Мой магазин</div>
      <div class="shopStatus" id="shopStatus">кабинет продавца</div>
    </div>
  </div>
</div>
<main>
  <section id="sec-stats">
    <div class="secTitle">Статистика <span style="font-size:10px;color:var(--gray);font-weight:600">за 30 дней</span></div>
    <div id="statsBox"></div>
  </section>
  <section id="sec-bouquets" class="hidden">
    <div class="secTitle">Мои букеты <span class="cnt" id="cntBouq">0</span></div>
    <div id="trendBlock"></div>
    <div id="bouqList"></div>
  </section>
  <section id="sec-reviews" class="hidden">
    <div class="secTitle">Отзывы <span class="cnt" id="cntRev">0</span></div>
    <div id="qrBlock"></div>
    <div id="revList"></div>
  </section>
  <section id="sec-shop" class="hidden">
    <div class="secTitle">Мой магазин</div>
    <div class="card">
      <div class="fieldLbl"><svg class="icn"><use href="#i-shop"/></svg>Основное</div>
      <input id="shName" placeholder="Название магазина">
      <input id="shCity" placeholder="Город (например: Новороссийск)">
      <input id="shPhone" placeholder="Телефон">
      <input id="shAddr" placeholder="Адрес (улица, дом)">
      <textarea id="shDesc" placeholder="Описание (чем сильны, что специализируетесь)"></textarea>
      <div class="fieldLbl"><svg class="icn"><use href="#i-arrow"/></svg>Куда вести клиентов (кнопки «Где заказать»)</div>
      <input id="shTg" placeholder="Telegram (@username)">
      <input id="shWeb" placeholder="Сайт (https://…)">
      <input id="shMap" placeholder="Ссылка на карту (Яндекс / 2ГИС)">
      <input id="shDel" type="number" placeholder="Доставка от, минут (например: 30)">

  $('fCatRow').addEventListener('click',e=>{
    const btn=e.target.closest('[data-cat]');if(!btn)return;
    pickedCat=btn.dataset.cat;
    document.querySelectorAll('#fCatRow .chip').forEach(x=>x.classList.toggle('on',x.dataset.cat===pickedCat));
  });
  $('fTagRow').addEventListener('click',e=>{
    const rm=e.target.closest('[data-tag-rm]');
    if(rm){e.stopPropagation();toggleTag(rm.dataset.tagRm);return;}
    const btn=e.target.closest('[data-tag]');
    if(btn)toggleTag(btn.dataset.tag);
  });
  $('bouqSheet').classList.remove('hidden');
}
function openEditBouquet(id){
  const b=myBouquets.find(x=>x.id===id);if(!b)return;
  openAddBouquet();
  editingId=id;
  $('fTitle').value=b.title;$('fPrice').value=b.price;$('fDesc').value=b.description||'';$('fStock').checked=b.in_stock;
  pickedCat=b.category||'';
  setTimeout(refreshCatRow,0);
  pickedTags=getTags(b);
  renderTagChips();
  if(b.photo_url){$('fPrev').src=b.photo_url;$('fPrevWrap').classList.remove('hidden');}
  $('bouqHead').textContent='Редактировать букет';
  $('bouqSaveBtn').textContent='Сохранить изменения';
}
function pickPhoto(inp){const f=inp.files[0];if(!f)return;pickedPhoto=f;const r=new FileReader();r.onload=e=>{$('fPrev').src=e.target.result;$('fPrevWrap').classList.remove('hidden');};r.readAsDataURL(f);}
async function submitBouquet(){
  const t=$('fTitle').value.trim(),p=+$('fPrice').value;
  if(!t||!p){toast('Заполни название и цену','i-x');return;}
  showLoader();
  try{
    let photo_url=null;
    if(pickedPhoto){
      const path=me.id+'/'+Date.now()+'.jpg';
      const up=await sb.storage.from('bouquets').upload(path,pickedPhoto,{contentType:pickedPhoto.type});
      if(up.error){toast('Фото: '+up.error.message,'i-x');return;}
      photo_url=sb.storage.from('bouquets').getPublicUrl(path).data.publicUrl;
    }
    if(editingId){
      const upd={title:t,price:p,description:$('fDesc').value.trim(),category:pickedCat,tags:pickedTags,in_stock:$('fStock').checked};
      if(photo_url)upd.photo_url=photo_url;
      const res=await sb.from('bouquets').update(upd).eq('id',editingId).eq('user_id',me.id);
      if(res.error){toast('Ошибка: '+res.error.message,'i-x');return;}
      toast('Букет обновлён','i-check');
    }else{
      const res=await sb.from('bouquets').insert({title:t,price:p,description:$('fDesc').value.trim(),category:pickedCat,tags:pickedTags,photo_url,in_stock:$('fStock').checked,user_id:me.id});
      if(res.error){toast('Ошибка: '+res.error.message,'i-x');return;}
      toast('Букет добавлен','i-check');
    }
    closeSheet('bouqSheet');
    await refresh();
  }finally{hideLoader();}
}
async function delBouquet(id){
  if(!confirm('Удалить букет? Связанные заказы и лайки тоже удалятся.'))return;
  showLoader();
  try{
    await sb.from('orders').delete().eq('bouquet_id',id);
    await sb.from('favorites').delete().eq('bouquet_id',id);
    await sb.from('bouquet_likes').delete().eq('bouquet_id',id);
    await sb.from('bouquet_comments').delete().not('parent_id','is',null).eq('bouquet_id',id);
    await sb.from('bouquet_comments').delete().eq('bouquet_id',id);
    const res=await sb.from('bouquets').delete().eq('id',id).eq('user_id',me.id);
    if(res.error){toast('Ошибка: '+res.error.message,'i-x');return;}
    toast('Букет удалён','i-check');
    await refresh();
  }finally{hideLoader();}
}
let quickReplies=['Спасибо за отзыв!','Будем стараться для вас 🌸','Рады, что вам понравилось','Приходите ещё!','Извините за неудобства, исправимся'];
function loadQR(){const saved=localStorage.getItem('lep_qr_'+(me?me.id:'x'));if(saved){try{quickReplies=JSON.parse(saved);}catch(e){}}}
function saveQR(){if(me)localStorage.setItem('lep_qr_'+me.id,JSON.stringify(quickReplies));}
function renderQR(){
  const box=$('qrBlock');if(!box)return;
  box.innerHTML='<div class="qrBlock"><h4>'+ic('i-wand')+'Шаблоны ответов</h4><div class="qrChips">'+quickReplies.map((q,i)=>'<span class="qrChip" data-qi="'+i+'">'+esc(q)+'<span class="rm" data-qr="'+i+'">×</span></span>').join('')+'</div><div class="qrAdd"><input id="qrNew" placeholder="новая фраза-шаблон"><button onclick="addQR()">'+ic('i-plus')+'</button></div><div style="font-size:10px;color:var(--gray);margin-top:6px">Клик по шаблону — вставится в поле ответа</div></div>';
}
function addQR(){
  const inp=$('qrNew');const t=inp.value.trim();
  if(!t)return;
  if(quickReplies.includes(t)){toast('Такой уже есть','i-x');return;}
  quickReplies.push(t);saveQR();renderQR();inp.value='';
  toast('Шаблон добавлен','i-check');
}
function removeQR(i){quickReplies.splice(i,1);saveQR();renderQR();}
function insertQR(txt){const input=activeReplyInput&&document.contains(activeReplyInput)?activeReplyInput:document.querySelector('.replyInput input');if(!input)return;input.value=txt;input.focus();}
function renderReviews(){
  const box=$('revList');
  const ids=myBouquets.map(b=>b.id);
  const list=myReviews.filter(c=>ids.includes(c.bouquet_id)&&!c.parent_id);
  box.innerHTML=list.length?list.map(c=>{
    const b=myBouquets.find(x=>x.id===c.bouquet_id);
    const replies=myReplies.filter(r=>r.parent_id===c.id).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    return '<div class="revRow">'+
      '<div class="revHead"><div class="revAva">'+esc((c.user_nick||'?').slice(0,1).toUpperCase())+'</div><div style="flex:1;min-width:0"><div class="revNick">'+esc(c.user_nick||'аноним')+'</div><div class="revDate">'+whenRu(c.created_at)+'</div></div></div>'+
      (b?'<div class="revBq">→ '+esc(b.title)+'</div>':'')+
      (c.rating?'<div class="revStars">'+[1,2,3,4,5].map(n=>'<svg class="icn" style="color:'+(n<=c.rating?'var(--yel)':'rgba(148,163,184,.35)')+'"><use href="#i-star"/></svg>').join('')+'</div>':'')+
      '<div class="revText">'+esc(c.text)+'</div>'+
      (replies.length?'<div class="replyChain">'+replies.map(r=>'<div class="replyItem"><div class="rpNick">'+(r.user_id===me.id?'Ты':esc(r.user_nick||'аноним'))+'</div>'+esc(r.text)+'</div>').join('')+'</div>':'')+
      '<div class="replyInput"><input placeholder="Твой ответ..." maxlength="500" data-reply-for="'+c.id+'"><button onclick="sendReply('+c.id+')">'+ic('i-arrow')+'</button></div>'+
    '</div>';
  }).join(''):'<div class="empty">'+icBig('i-comment')+'Отзывов пока нет</div>';
}
async function sendReply(reviewId){
  const input=document.querySelector('[data-reply-for="'+reviewId+'"]');
  if(!input)return;
  const t=input.value.trim();
  if(!t){toast('Напиши ответ','i-x');return;}
  showLoader();
  try{
    const {error}=await sb.from('bouquet_comments').insert({bouquet_id:myReviews.find(r=>r.id===reviewId)?.bouquet_id,text:t,user_id:me.id,user_nick:'Магазин',parent_id:reviewId,status:'approved'});
    if(error){toast('Ошибка: '+error.message,'i-x');return;}
    toast('Ответ отправлен','i-check');
    await refresh();
  }finally{hideLoader();}
}
function pickLogo(inp){const f=inp.files[0];if(!f)return;pickedLogo=f;const r=new FileReader();r.onload=e=>{$('lPrev').src=e.target.result;$('lPrevWrap').classList.remove('hidden');};r.readAsDataURL(f);}
async function saveShop(){
  const phone=$('shPhone').value.trim();
  if(!$('shName').value.trim()){toast('Укажи название магазина','i-x');return;}
  const data={
    name:$('shName').value.trim(),
    city:($('shCity').value.trim()||DEFAULT_CITY),
    phone:phone,
    address:$('shAddr').value.trim(),
    description:$('shDesc').value.trim(),
    telegram:$('shTg').value.trim(),
    website:$('shWeb').value.trim(),
    map_link:$('shMap').value.trim(),
    delivery_min:+$('shDel').value||null,
    owner_id:me.id
  };
  if(pickedLogo){
    const path=me.id+'/logo_'+Date.now()+'.jpg';
    const up=await sb.storage.from('bouquets').upload(path,pickedLogo,{contentType:pickedLogo.type});
    if(up.error){toast('Лого: '+up.error.message,'i-x');return;}
    data.logo_url=sb.storage.from('bouquets').getPublicUrl(path).data.publicUrl;
  }else if(shop){data.logo_url=shop.logo_url;}
  showLoader();
  try{
    let res;
    if(shop){res=await sb.from('shops').update(data).eq('id',shop.id);}
    else{res=await sb.from('shops').upsert(data,{onConflict:'owner_id'}).select();}
    if(res.error){toast('Ошибка: '+res.error.message,'i-x');return;}
    pickedLogo=null;
    toast('Магазин сохранён','i-check');
    await refresh();
  }finally{hideLoader();}
}
loadQR();
boot();
</script>
</body>
</html>
