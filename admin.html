<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лепесток · админка</title>
<link href="https://fonts.cdnfonts.com/css/opposans" rel="stylesheet">
<style>
:root{--bg:#FFF7F5;--card:#FFFFFF;--ink:#1A1A2E;--gray:#94A3B8;--red:#EF4444;--yel:#F59E0B;--grn:#10B981;--gold:#D97706;--coral:#FF6B6B;--pink:#FF6B9D;--purple:#A855F7;--gradient:linear-gradient(135deg,#FF6B6B 0%,#FF6B9D 50%,#A855F7 100%);--shadow:0 6px 20px rgba(120,60,10,.08)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'OPPO Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(160deg,#FFF7F5 0%,#FFEDEB 45%,#F6ECFF 100%);color:var(--ink);min-height:100vh;padding:16px 14px 34px}
.box{max-width:620px;margin:0 auto}
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.headLogo{width:44px;height:44px;border-radius:15px;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 22px rgba(255,107,107,.35);flex:none}
.headLogo .icn{width:24px;height:24px}
h1{font-size:17px;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.5px}
.who{font-size:10.5px;color:var(--gray);margin-top:1px}
.card{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);margin-bottom:10px}
input,textarea,select{width:100%;background:var(--bg);border:2px solid transparent;border-radius:12px;padding:11px;font-size:14px;margin-bottom:8px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--coral)}
textarea{min-height:70px;resize:vertical}
.btn{width:100%;background:var(--gradient);color:#fff;border:none;border-radius:999px;padding:12px;font-weight:800;font-size:14px;cursor:pointer}
.err{color:var(--red);font-size:12px;margin-top:6px}
.modeSwitch{display:flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow);margin-bottom:12px}
.modeBtn{flex:1;border:none;background:none;border-radius:999px;padding:9px;font-size:11.5px;font-weight:800;color:var(--gray);cursor:pointer;transition:.25s}
.modeBtn.on{background:var(--gradient);color:#fff;box-shadow:0 4px 14px rgba(255,107,107,.35)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tabs.three{grid-template-columns:repeat(3,1fr)}
.tab{background:var(--card);border:none;border-radius:14px;padding:10px 4px;font-weight:700;font-size:10.5px;color:var(--gray);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:var(--shadow);white-space:nowrap;transition:.25s}
.tab .icn{width:14px;height:14px;flex:none}
.tab.on{background:var(--gradient);color:#fff;box-shadow:0 6px 18px rgba(255,107,107,.35)}
.badge{min-width:17px;height:17px;padding:0 5px;border-radius:999px;font-size:9.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;background:var(--gradient);color:#fff;flex:none}
.tab.on .badge{background:rgba(255,255,255,.28);color:#fff}
.mcat{font-size:10.5px;color:var(--gray);margin-bottom:5px}
.mtxt{font-size:13.5px;line-height:1.45;margin-bottom:8px}
.mbtns{display:flex;gap:6px;flex-wrap:wrap}
.mbtns button{flex:1;border:none;border-radius:999px;padding:9px 6px;font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap}
.ok{background:linear-gradient(135deg,#10B981,#059669);color:#fff}
.no{background:#FFF1F0;color:var(--red)}
.day{background:var(--gradient);color:#fff}
.info{background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff}
.empty{text-align:center;color:var(--gray);padding:26px;font-size:13px}
.out{background:none;border:none;color:var(--gray);font-size:12px;margin-top:10px;cursor:pointer;width:100%}
.hidden{display:none!important}
.who2{font-size:10.5px;color:var(--gray);margin-bottom:10px}
.bigStat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.bigStat>div{background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.bigStat .lbl{font-size:10px;color:var(--gray);font-weight:600}
.bigStat .val{font-size:19px;font-weight:800;margin-top:2px}
.bigStat .val b{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.bigStat .sub{font-size:9.5px;color:var(--gray);margin-top:2px}
.funnel{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);margin-bottom:10px}
.funnel .frow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.funnel .fname{width:120px;font-weight:600}
.funnel .fbar{flex:1;height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.funnel .fbar i{display:block;height:100%;background:var(--gradient);border-radius:4px}
.funnel .fnum{width:46px;text-align:right;font-weight:800;color:var(--coral)}
.tagFunnel .frow .fname{width:130px}
.tagFunnel .frow .fnum{width:80px}
.tagFunnel .frow .conv{font-size:10px;color:var(--grn);font-weight:800;margin-left:2px}
.tagFunnel .frow .conv.low{color:var(--gray)}
.dayRow{display:flex;gap:8px;align-items:center;font-size:11px;padding:5px 0;border-bottom:1px solid rgba(255,107,107,.08)}
.dayRow .dLbl{width:70px;color:var(--gray)}
.dayRow .dBar{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.dayRow .dBar i{display:block;height:100%;background:var(--gradient);border-radius:3px}
.dayRow .dNum{width:40px;text-align:right;font-weight:800;color:var(--coral)}
.usrRow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,107,107,.08);font-size:12px}
.usrRow .pos{width:22px;font-weight:800;color:var(--gray);text-align:center}
.usrRow .av{width:28px;height:28px;border-radius:50%;font-size:11px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;background:var(--gradient)}
.usrRow .av img{width:100%;height:100%;object-fit:cover}
.usrRow .nm{flex:1;font-weight:600;word-break:break-word}
.usrRow .st{font-weight:800;color:var(--coral);font-size:11px}
.pill{display:inline-block;border-radius:999px;padding:2px 7px;font-size:9.5px;font-weight:700;margin-left:4px}
.pill.ret{background:rgba(16,185,129,.14);color:var(--grn)}
.pill.hot{background:rgba(255,107,107,.14);color:var(--coral)}
.pill.dir{background:rgba(148,163,184,.16);color:#64748B}
.pill.prom{background:rgba(168,85,247,.14);color:#A855F7}
.rangeSel{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.rangeSel button{background:var(--card);border:none;border-radius:999px;padding:7px 11px;font-size:10.5px;font-weight:700;color:var(--gray);cursor:pointer;box-shadow:var(--shadow)}
.rangeSel button.on{background:var(--gradient);color:#fff;box-shadow:0 4px 14px rgba(255,107,107,.3)}
.statusPill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:10px;font-weight:800}
.s-new{background:rgba(255,107,107,.14);color:var(--coral)}
.s-accepted{background:rgba(245,158,11,.14);color:var(--yel)}
.s-ready{background:rgba(217,119,6,.14);color:var(--gold)}
.s-delivered{background:rgba(16,185,129,.14);color:var(--grn)}
.s-cancelled{background:rgba(148,163,184,.14);color:var(--gray);text-decoration:line-through}
.bouquetRow{display:flex;gap:10px;align-items:flex-start}
.bouquetRow .photo{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--bg)}
.bouquetRow .bInfo{flex:1;min-width:0}
.bouquetRow .title{font-weight:800;font-size:13px}
.bouquetRow .price{color:var(--coral);font-weight:800;font-size:13px;margin-top:2px}
.bouquetRow .cat{font-size:10.5px;color:var(--gray);margin-top:2px}
.bouquetRow .bTags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.bouquetRow .bTags span{font-size:9px;background:rgba(255,107,107,.1);color:var(--coral);padding:2px 7px;border-radius:999px;font-weight:700}
.orderMeta{font-size:11.5px;color:var(--gray);line-height:1.5;margin-top:6px}
.orderMeta b{color:var(--ink)}
.addForm{background:linear-gradient(180deg,rgba(255,107,107,.06),#fff);border:2px dashed rgba(255,107,107,.4);border-radius:18px;padding:12px;margin-bottom:10px}
.addForm h3{font-size:13px;margin-bottom:8px;font-weight:800}
.addForm label{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:6px;cursor:pointer}
.addForm input[type=checkbox]{width:auto;margin:0}
.icn{width:1.05em;height:1.05em;display:inline-block;vertical-align:-.15em;flex:none}
.secHd{font-size:12.5px;font-weight:800;margin:14px 0 8px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.secHd .icn{width:14px;height:14px;color:var(--coral)}
.tagInsight{background:linear-gradient(120deg,#FFF3F1 0%,#FFECEF 100%);border-radius:14px;padding:10px 12px;font-size:11px;line-height:1.5;color:var(--gray);margin-top:8px;border:1.5px dashed rgba(255,107,107,.3)}
.tagInsight b{color:var(--coral)}
.loader{position:fixed;inset:0;z-index:200;background:rgba(255,255,255,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;pointer-events:all}
.loader .spin{width:42px;height:42px;border:3px solid rgba(255,107,107,.2);border-top-color:var(--coral);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(30,41,59,.95);color:#F1F5F9;border:2px solid rgba(255,107,107,.4);border-radius:16px;box-shadow:0 12px 48px rgba(255,107,107,.3);font-weight:700;font-size:13px;padding:12px 20px;text-align:center;max-width:82vw;z-index:300}
#toast .icn{width:15px;height:15px;margin-right:6px;vertical-align:-2px;color:var(--pink)}
#toast:not(.hidden){animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.revChart{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);margin-bottom:10px}
.revChart .mcat{font-size:10.5px;color:var(--gray);font-weight:700;margin-bottom:10px}
.revBars{display:flex;align-items:flex-end;gap:4px;height:90px;padding-bottom:4px;border-bottom:1px dashed rgba(255,107,107,.2)}
.revBars .bar{flex:1;background:var(--gradient);border-radius:4px 4px 0 0;min-height:2px;position:relative;cursor:pointer}
.revBars .bar::before{content:attr(data-val);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:var(--coral);white-space:nowrap;opacity:0}
.revBars .bar:hover::before{opacity:1}
.revChart .days{display:flex;gap:4px;margin-top:4px}
.revChart .days span{flex:1;text-align:center;font-size:8.5px;color:var(--gray);font-weight:700}
.bulkBar{display:flex;gap:6px;align-items:center;margin-bottom:10px;padding:8px;background:linear-gradient(120deg,#FFF3F1,#FFECEF);border-radius:14px;box-shadow:var(--shadow)}
.bulkBar .cnt{font-size:11px;font-weight:800;color:var(--ink)}
.bulkBar button{border:none;border-radius:999px;padding:7px 12px;font-size:10.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.bulkBar .accept{background:linear-gradient(135deg,#10B981,#059669);color:#fff}
.bulkBar .cancel{background:#FFF1F0;color:var(--red)}
.logList{max-height:200px;overflow-y:auto;font-size:11px;line-height:1.7}
.logList .lItem{padding:4px 0;border-bottom:1px dashed rgba(255,107,107,.1);display:flex;gap:8px;align-items:flex-start}
.logList .lTime{color:var(--gray);font-size:10px;flex:none;width:80px}
.logList .lAct{color:var(--ink);flex:1;word-break:break-word}
.searchRow{display:flex;gap:6px;margin-bottom:10px}
.searchRow input{flex:1;margin:0;padding:9px 12px;font-size:12px}
</style>
</head>

async function boot(){
  const {data}=await sb.auth.getSession();
  if(data.session){const email=(data.session.user.email||'').toLowerCase();if(email===ADMIN_EMAIL){panel();return;}await sb.auth.signOut();}
  $('loginBox').classList.remove('hidden');
}
async function doLogin(){
  const email=$('email').value.trim(),pass=$('pass').value;
  if(email.toLowerCase()!==ADMIN_EMAIL){$('loginErr').textContent='Вход только для администратора';return;}
  showLoader();
  try{
    const {error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){$('loginErr').textContent='Неверный email или пароль';return;}
    $('loginBox').classList.add('hidden');panel();
  }finally{hideLoader();}
}
async function panel(){
  const u=(await sb.auth.getUser()).data.user;adminId=u?u.id:null;
  $('adminWho').textContent='админ: '+(u?u.email:'');
  $('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');
  await refresh();
}
async function refresh(){
  showLoader();
  try{
    const [b,o,c,evAll,sh,cats]=await Promise.all([
      sb.from('bouquets').select('*').order('created_at',{ascending:false}),
      sb.from('orders').select('*').order('created_at',{ascending:false}),
      sb.from('bouquet_comments').select('*').order('created_at',{ascending:false}),
      sb.from('events').select('*').gte('created_at',new Date(Date.now()-30*864e5).toISOString()).order('created_at',{ascending:true}),
      sb.from('shops').select('*').order('id'),
      sb.from('categories').select('*').order('id')
    ]);
    bouquets=b.data||[];orders=o.data||[];comments=c.data||[];evFull=evAll.data||[];shopsAll=sh.data||[];categories=cats.data||[];
    leadsByShop={};shopViewsByShop={};leadsChByShop={};
    evFull.forEach(e=>{
      const m=e.metadata||{};
      if(e.name==='lead'&&m.shop_id){
        leadsByShop[m.shop_id]=(leadsByShop[m.shop_id]||0)+1;
        const ch=m.channel||'other';
        leadsChByShop[m.shop_id]=leadsChByShop[m.shop_id]||{};
        leadsChByShop[m.shop_id][ch]=(leadsChByShop[m.shop_id][ch]||0)+1;
      }
      if(e.name==='shop_view'&&m.shop_id)shopViewsByShop[m.shop_id]=(shopViewsByShop[m.shop_id]||0)+1;
    });
    $('cOrders').textContent=orders.filter(o=>o.status==='new').length;
    metricsCache=null;
    if(viewMode==='admin')renderList();
  }finally{hideLoader();}
}
function setMode(m){
  viewMode=m;
  $('modeAdmin').classList.toggle('on',m==='admin');
  $('modeSeller').classList.toggle('on',m==='seller');
  $('adminTabs').classList.toggle('hidden',m!=='admin');
  $('sellerTabs').classList.toggle('hidden',m!=='seller');
  if(m==='seller')refreshSeller();else renderList();
}
function setTab(t){tab=t;selectedOrders.clear();['Orders','Shops','Bouquets','Comments','Stats','Users'].forEach(k=>$('tab'+k).classList.toggle('on',t===k.toLowerCase()));renderList();}
function setUsrRange(r){usrStatsRange=r;renderList();}
function setOrderFilter(f){orderFilter=f;if(viewMode==='seller')renderSList();else renderList();}
function renderList(){
  if(tab==='orders')renderOrders();
  else if(tab==='shops')renderShopsAdmin();
  else if(tab==='bouquets')renderBouquets();
  else if(tab==='comments')renderComments();
  else if(tab==='stats')renderStats();
  else if(tab==='users')renderUsers();
}
/* ===== заказы ===== */
function orderCard(o,list,admin){
  const b=list.find(x=>x.id===o.bouquet_id);
  const kindRu=o.kind==='delivery'?'🚚 доставка':'🏠 самовывоз';
  const next=({new:'accepted',accepted:'ready',ready:'delivered'})[o.status];
  const cancelBtn=(o.status!=='delivered'&&o.status!=='cancelled')?'<button class="no" onclick="updateOrder('+o.id+',\'cancelled\')">отменить</button>':'';
  const nextBtn=next?'<button class="ok" onclick="updateOrder('+o.id+',\''+next+'\')">→ '+statusRu(next)+'</button>':'';
  const back=({delivered:'ready',ready:'accepted',accepted:'new'})[o.status];
  const backBtn=back?'<button class="info" onclick="updateOrder('+o.id+',\''+back+'\')">← назад</button>':'';
  const callBtn=o.recipient_phone?'<button class="day" onclick="call(\''+esc(o.recipient_phone)+'\')">📞 позвонить</button>':(o.sender_phone?'<button class="day" onclick="call(\''+esc(o.sender_phone)+'\')">📞 заказчик</button>':'');
  const bTags=b?getTags(b):[];
  const tagsHtml=bTags.length?'<div class="bTags">'+bTags.slice(0,5).map(t=>'<span>'+esc(t)+'</span>').join('')+'</div>':'';
  const chk=admin?'<input type="checkbox" style="width:18px;height:18px;flex:none;margin-right:8px;accent-color:var(--coral)" '+(selectedOrders.has(o.id)?'checked':'')+' onclick="toggleOrderSel('+o.id+',this.checked)">':'';
  return '<div class="card"><div style="display:flex;align-items:flex-start">'+chk+
    '<div style="flex:1"><div class="mcat">'+whenRu(o.created_at)+' · <span class="statusPill '+statusCls(o.status)+'">'+statusRu(o.status)+'</span></div>'+
    '<div class="bouquetRow">'+(b&&b.photo_url?'<img class="photo" src="'+b.photo_url+'">':'<div class="photo" style="display:flex;align-items:center;justify-content:center;font-size:26px">🌷</div>')+
    '<div class="bInfo"><div class="title">'+esc(b?b.title:'Букет удалён')+'</div><div class="price">'+(b?b.price+' ₽':'?')+'</div><div class="cat">'+kindRu+'</div>'+tagsHtml+'</div></div>'+
    '<div class="orderMeta">'+
      (o.recipient_name?'<div>👤 получатель: <b>'+esc(o.recipient_name)+'</b>'+(o.recipient_phone?' · '+esc(o.recipient_phone):'')+'</div>':'')+
      (o.address?'<div>📍 адрес: <b>'+esc(o.address)+'</b></div>':'')+
      (o.sender_name?'<div>📲 заказчик: <b>'+esc(o.sender_name)+'</b>'+(o.sender_phone?' · '+esc(o.sender_phone):'')+'</div>':'')+
      (o.note?'<div>📝 комментарий: <i>'+esc(o.note)+'</i></div>':'')+
    '</div>'+
    '<div class="mbtns" style="margin-top:8px">'+callBtn+backBtn+nextBtn+cancelBtn+'</div></div></div>';
}
function toggleOrderSel(id,on){if(on)selectedOrders.add(id);else selectedOrders.delete(id);renderBulkBar();}
function renderBulkBar(){
  const box=$('bulkBar');if(!box)return;
  if(selectedOrders.size<2){box.innerHTML='';return;}
  const fresh=[...selectedOrders].filter(id=>orders.find(o=>o.id===id&&o.status==='new')).length;
  box.innerHTML='<span class="cnt">'+selectedOrders.size+' выбрано</span>'+
    (fresh>0?'<button class="accept" onclick="bulkStatus(\'accepted\')">✓ Принять '+fresh+'</button>':'')+
    '<button class="cancel" onclick="bulkStatus(\'cancelled\')">✕ Отменить выбранные</button>';
}
async function bulkStatus(st){
  const ids=[...selectedOrders];if(!ids.length)return;
  if(!confirm('Изменить статус '+ids.length+' заказов?'))return;
  showLoader();
  try{
    const res=await sb.from('orders').update({status:st}).in('id',ids);
    if(res.error){toast('Ошибка: '+res.error.message,'i-x');return;}
    logAdmin('bulk_status',{status:st,count:ids.length});
    toast('Обновлено '+ids.length+' заказов','i-check');
    selectedOrders.clear();
    await refresh();
  }finally{hideLoader();}
}
function exportOrdersCSV(){
  if(!orders.length){toast('Нет заказов для экспорта','i-x');return;}
  const rows=[['ID','Дата','Букет','Цена','Статус','Тип','Получатель','Телефон','Адрес','Заказчик','Комментарий']];
  orders.forEach(o=>{
    const b=bouquets.find(x=>x.id===o.bouquet_id);
    rows.push([o.id,new Date(o.created_at).toLocaleString('ru-RU'),b?b.title:'—',b?b.price:'',statusRu(o.status).replace(/[🆕⏳✅❌]\s*/g,''),o.kind==='delivery'?'доставка':'самовывоз',o.recipient_name||'',o.recipient_phone||'',o.address||'',o.sender_name||'',(o.note||'').replace(/\n/g,' ')]);
  });
  const csv=rows.map(r=>r.map(c=>{const s=String(c==null?'':c);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='orders_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();URL.revokeObjectURL(url);
  logAdmin('export_csv',{count:orders.length});
  toast('CSV экспортирован','i-download');
}
function renderOrders(){
  const box=$('list');
  const filters=[['new','🆕 новые'],['accepted','⏳ приняты'],['ready','✅ готовы'],['delivered','🚚 доставлены'],['cancelled','❌ отменены']];
  let filtered=orders.filter(o=>o.status===orderFilter);
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    filtered=filtered.filter(o=>{
      const b=bouquets.find(x=>x.id===o.bouquet_id);
      return (b&&b.title.toLowerCase().includes(q))||(o.recipient_name&&o.recipient_name.toLowerCase().includes(q))||(o.sender_name&&o.sender_name.toLowerCase().includes(q))||String(o.id).includes(q);
    });
  }
  const cards=filtered.length?filtered.map(o=>orderCard(o,bouquets,true)).join(''):'<div class="empty">Нет заказов со статусом «'+statusRu(orderFilter)+'» 🎉</div>';
  box.innerHTML=
    '<div class="searchRow"><input placeholder="Поиск по названию, имени или ID" value="'+esc(searchQuery)+'" oninput="searchQuery=this.value.toLowerCase();renderOrders()"></div>'+
    '<div style="margin-bottom:10px"><button class="btn" style="padding:10px;font-size:12px" onclick="exportOrdersCSV()">'+ic('i-download')+' Экспорт CSV</button></div>'+
    '<div id="bulkBar"></div>'+
    '<div class="rangeSel">'+filters.map(f=>'<button class="'+(orderFilter===f[0]?'on':'')+'" onclick="setOrderFilter(\''+f[0]+'\')">'+f[1]+' ('+orders.filter(o=>o.status===f[0]).length+')</button>').join('')+'</div>'+cards;
  renderBulkBar();
}
function call(p){window.location.href='tel:'+p.replace(/\s+/g,'');}
async function updateOrder(id,status){
  showLoader();
  try{
    const res=await sb.from('orders').update({status}).eq('id',id).select();
    if(res.error){toast('Ошибка: '+res.error.message,'i-x');return;}
    logAdmin('order_status',{order_id:id,status});
    toast('Статус обновлён','i-check');
    if(viewMode==='seller')await refreshSeller();else await refresh();

/* ===== магазины (справочник) ===== */
function shopRating(s){
  const bids=bouquets.filter(b=>b.user_id===s.owner_id).map(b=>b.id);
  const rc=comments.filter(c=>bids.includes(c.bouquet_id)&&c.rating);
  if(!rc.length)return 0;
  return rc.reduce((a,c)=>a+c.rating,0)/rc.length;
}
function shopCount(s){return bouquets.filter(b=>b.user_id===s.owner_id&&b.photo_url).length;}

async function saveShopAdmin(){
  const name=$('saName').value.trim();
  if(!name){toast('Укажи название','i-x');return;}
  const data={
    name:name,
    city:$('saCity').value.trim()||DEFAULT_CITY,
    phone:$('saPhone').value.trim(),
    address:$('saAddr').value.trim(),
    description:$('saDesc').value.trim(),
    telegram:$('saTg').value.trim(),
    website:$('saWeb').value.trim(),
    map_link:$('saMap').value.trim(),
    delivery_min:+$('saDel').value||null,
    kind:$('saKind').value,
    verified:$('saVer').checked,
    promoted:$('saProm').checked
  };
  showLoader();
  try{
    if(shopFormPhoto){
      const path='admin/logo_'+Date.now()+'.jpg';
      const up=await sb.storage.from('bouquets').upload(path,shopFormPhoto,{contentType:shopFormPhoto.type});
      if(up.error){toast('Лого: '+up.error.message,'i-x');return;}
      data.logo_url=sb.storage.from('bouquets').getPublicUrl(path).data.publicUrl;
    }
    let res;
    if(shopEditId){res=await sb.from('shops').update(data).eq('id',shopEditId);}
    else{res=await sb.from('shops').insert(data);}
    if(res.error){toast('Ошибка: '+res.error.message,'i-x');return;}
    logAdmin(shopEditId?'edit_shop':'add_shop',{name});
    toast('Магазин сохранён','i-check');
    shopFormOpen=false;shopEditId=null;shopFormPhoto=null;
    await refresh();
  }finally{hideLoader();}
}

  await refresh();

async function delCategory(name){

/* ===== метрики ===== */
function sessionsFromEvents(events){const GAP=5*60*1000;const byDev={};events.forEach(e=>{const dev=e.device||'__anon__';(byDev[dev]=byDev[dev]||[]).push(new Date(e.created_at).getTime());});const sessions=[];Object.entries(byDev).forEach(([dev,ts])=>{ts.sort((a,b)=>a-b);let start=ts[0],last=ts[0];for(let i=1;i<ts.length;i++){if(ts[i]-last>GAP){sessions.push({dev,start,end:last,len:last-start});start=ts[i];}last=ts[i];}sessions.push({dev,start,end:last,len:last-start});});return sessions;}
function computeMetrics(days){
  if(metricsCache&&metricsCacheDays===days)return metricsCache;
  const since=Date.now()-days*864e5;
  const ev=evFull.filter(e=>new Date(e.created_at).getTime()>=since);
  const devs=new Set(ev.map(e=>e.device||e.user_id||'__anon__'));
  const dayMap={};ev.forEach(e=>{const k=dayKey(e.created_at);(dayMap[k]=dayMap[k]||{devs:new Set(),ev:0});dayMap[k].devs.add(e.device||e.user_id||'__anon__');dayMap[k].ev++;});
  const daysArr=Object.keys(dayMap).sort();
  let returners=0;for(let i=1;i<daysArr.length;i++){const prev=dayMap[daysArr[i-1]].devs,cur=dayMap[daysArr[i]].devs;cur.forEach(d=>{if(prev.has(d))returners++;});}
  const uniqByType=n=>new Set(ev.filter(e=>e.name===n).map(e=>e.device||e.user_id||'__anon__')).size;
  const funnel={open:uniqByType('open'),view:uniqByType('view'),order:uniqByType('order'),comment:uniqByType('comment'),share:uniqByType('share'),reg:uniqByType('reg')};
  const sessions=sessionsFromEvents(ev);const real=sessions.filter(s=>s.len>5000);
  const avgLen=real.length?Math.round(real.reduce((a,s)=>a+s.len,0)/real.length/1000):0;
  metricsCache={sessions,devs,dayMap,daysArr,returners,funnel,ev,avgLen};
  metricsCacheDays=days;
  return metricsCache;
}
function computeTagMetrics(events){
  const views={},orders={};
  events.forEach(e=>{
    const m=e.metadata||{};const tags=m.tags||[];
    if(!Array.isArray(tags))return;
    tags.forEach(t=>{
      if(!t)return;
      const k=String(t).toLowerCase().trim();if(!k)return;
      if(e.name==='view')views[k]=(views[k]||0)+1;
      if(e.name==='order')orders[k]=(orders[k]||0)+1;
    });
  });
  const all=new Set([...Object.keys(views),...Object.keys(orders)]);
  const rows=[];
  all.forEach(tag=>{
    const v=views[tag]||0,o=orders[tag]||0;
    rows.push({tag,views:v,orders:o,conv:v>0?Math.round(o/v*100):0});
  });
  rows.sort((a,b)=>(b.orders-a.orders)||(b.views-a.views));
  return rows.slice(0,15);
}

  }finally{hideLoader();}
}
function renderSList(){if(sTab==='orders')sRenderOrders();else if(sTab==='bouquets')sRenderBouquets();else sRenderReviews();}
function sRenderOrders(){
  const box=$('list');
  const filters=[['new','🆕 новые'],['accepted','⏳ приняты'],['ready','✅ готовы'],['delivered','🚚 доставлены'],['cancelled','❌ отменены']];
  const filtered=myOrders.filter(o=>o.status===orderFilter);
  const cards=filtered.length?filtered.map(o=>orderCard(o,myBouquets,false)).join(''):'<div class="empty">У продавца нет заказов со статусом «'+statusRu(orderFilter)+'» 🎉</div>';
  box.innerHTML=(imFlorist?'':'<div class="card" style="text-align:center"><div style="font-size:12px;color:var(--gray);margin-bottom:8px">На твоём аккаунте не включён продавец</div><button class="btn" onclick="enableMeFlorist()">⭐ Включить мне продавца</button></div>')+
    '<div class="rangeSel">'+filters.map(f=>'<button class="'+(orderFilter===f[0]?'on':'')+'" onclick="setOrderFilter(\''+f[0]+'\')">'+f[1]+' ('+myOrders.filter(o=>o.status===f[0]).length+')</button>').join('')+'</div>'+cards;
}
function sRenderBouquets(){
  const box=$('list');
  const addForm='<div class="addForm"><h3>➕ Добавить новый букет (от продавца)</h3>'+
    '<input id="fTitle" placeholder="Название (например: Нежный пион)">'+
    '<input id="fPrice" type="number" placeholder="Цена в рублях">'+
    '<textarea id="fDesc" placeholder="Описание — что входит в букет"></textarea>'+
    '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">'+catList().map(c=>'<button type="button" data-c="'+esc(c)+'" onclick="fillCat(this)" style="border:2px solid rgba(148,163,184,.25);background:var(--bg);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700;color:var(--gray);cursor:pointer">'+esc(c)+'</button>').join('')+'</div>'+
    '<input id="fCat" placeholder="Категория">'+
    '<input id="fTags" placeholder="Теги через запятую (маме, нежный, розы)">'+
    '<button class="btn" style="background:var(--bg);color:var(--ink)" onclick="document.getElementById(\'fPhoto\').click()">📷 Фото букета</button>'+
    '<input type="file" id="fPhoto" accept="image/*" style="display:none" onchange="onPhotoPick(this)">'+
    '<span id="fPhotoName" style="font-size:10.5px;color:var(--gray)"></span>'+
    '<label><input type="checkbox" id="fStock" checked> В наличии</label>'+
    '<label><input type="checkbox" id="fDay"> Букет дня</label>'+
    '<button class="btn" style="margin-top:10px" onclick="submitBouquet()">Сохранить букет</button></div>';
  const list=myBouquets.length?myBouquets.map(b=>{
    const tags=getTags(b);
    const tagsHtml=tags.length?'<div class="bTags">'+tags.slice(0,6).map(t=>'<span>'+esc(t)+'</span>').join('')+(tags.length>6?'<span>+'+(tags.length-6)+'</span>':'')+'</div>':'';
    return '<div class="card"><div class="bouquetRow">'+(b.photo_url?'<img class="photo" src="'+b.photo_url+'">':'<div class="photo" style="display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,#FFE5E5,#F5E6FF)">🌷</div>')+
    '<div class="bInfo"><div class="title">'+esc(b.title)+(b.is_day?' <span class="statusPill s-new">⭐ букет дня</span>':'')+'</div>'+
    '<div class="price">'+b.price+' ₽</div><div class="cat">'+esc(b.category||'без категории')+' · '+(b.in_stock?'<span style="color:#10B981">в наличии</span>':'<span style="color:#EF4444">под заказ</span>')+'</div>'+tagsHtml+'</div></div>'+
    '<div class="mbtns" style="margin-top:8px">'+
      (b.is_day?'<button class="no" onclick="sToggleDay('+b.id+',false)">убрать из дня</button>':'<button class="day" onclick="sToggleDay('+b.id+',true)">⭐ букет дня</button>')+
      '<button class="info" onclick="sToggleStock('+b.id+','+(b.in_stock?'false':'true')+')">'+(b.in_stock?'в под заказ':'в наличии')+'</button>'+
      '<button class="no" onclick="sDelBouquet('+b.id+')">🗑 удалить</button>'+
    '</div></div>';
  }).join(''):'<div class="empty">У продавца пока нет букетов 🌷</div>';
  box.innerHTML=addForm+list;
}
function onPhotoPick(inp){const f=inp.files[0];if(!f)return;pickedPhoto=f;$('fPhotoName').textContent='📷 '+f.name.slice(0,20);}
async function submitBouquet(){
  const t=$('fTitle').value.trim(),p=+$('fPrice').value,d=$('fDesc').value.trim(),c=$('fCat').value.trim();
  const tagsRaw=$('fTags').value.trim();
  const tags=tagsRaw?tagsRaw.split(',').map(x=>x.trim()).filter(Boolean):[];
  if(!t||!p){toast('Заполни название и цену','i-x');return;}
  showLoader();
  try{
    let photo_url=null;
    if(pickedPhoto){
      const path=adminId+'/'+Date.now()+'.jpg';
      const up=await sb.storage.from('bouquets').upload(path,pickedPhoto,{contentType:pickedPhoto.type,upsert:false});
      if(up.error){toast('Фото: '+up.error.message,'i-x');return;}
      photo_url=sb.storage.from('bouquets').getPublicUrl(path).data.publicUrl;
    }
    const res=await sb.from('bouquets').insert({title:t,price:p,description:d,category:c,tags,photo_url,in_stock:$('fStock').checked,is_day:$('fDay').checked,user_id:adminId});
    if(res.error){toast('Ошибка: '+res.error.message,'i-x');return;}
    if($('fDay').checked){
      await sb.from('bouquets').update({is_day:false}).eq('user_id',adminId).eq('is_day',true);
      await sb.from('bouquets').update({is_day:true}).eq('id',res.data[0].id);
    }
    toast('Букет добавлен','i-check');
    pickedPhoto=null;
    await refreshSeller();
  }finally{hideLoader();}
}
async function sToggleDay(id,on){
  showLoader();
  try{
    if(on)await sb.from('bouquets').update({is_day:false}).eq('user_id',adminId).eq('is_day',true);
    const res=await sb.from('bouquets').update({is_day:on}).eq('id',id).select();
    if(res.error){toast('Ошибка: '+res.error.message,'i-x');return;}
    toast('Обновлено','i-check');
    await refreshSeller();
  }finally{hideLoader();}
}
async function sToggleStock(id,on){
  showLoader();
  try{
    const res=await sb.from('bouquets').update({in_stock:on}).eq('id',id).select();
    if(res.error){toast('Ошибка: '+res.error.message,'i-x');return;}
    toast('Обновлено','i-check');
    await refreshSeller();
  }finally{hideLoader();}
}
async function sDelBouquet(id){
  if(!confirm('Удалить букет?'))return;
  showLoader();
  try{
    const res=await sb.from('bouquets').delete().eq('id',id);
    if(res.error){toast('Ошибка: '+res.error.message,'i-x');return;}
    toast('Букет удалён','i-check');
    await refreshSeller();
  }finally{hideLoader();}
}
function sRenderReviews(){
  const box=$('list');
  const ids=myBouquets.map(b=>b.id);
  const filtered=myReviews.filter(c=>ids.includes(c.bouquet_id));
  const list=filtered.length?filtered.map(c=>{
    const b=myBouquets.find(x=>x.id===c.bouquet_id);
    return '<div class="card"><div class="mcat">'+whenRu(c.created_at)+' · '+(c.parent_id?'↩ ответ':' отзыв')+' · <b>'+esc(c.user_nick||'аноним')+'</b>'+(c.rating?' · ⭐'+c.rating:'')+'</div>'+
      (b?'<div class="mcat" style="color:#FF6B6B">к букету: '+esc(b.title)+'</div>':'')+
      '<div class="mtxt">'+esc(c.text)+'</div>'+
      '<div class="mbtns">'+(c.hidden?'<button class="ok" onclick="unhide('+c.id+')">↩ вернуть</button>':'<button class="no" onclick="hideComment('+c.id+')">скрыть</button>')+
      '<button class="no" onclick="killComment('+c.id+')">🗑 удалить</button></div></div>';
  }).join(''):'<div class="empty">Отзывов на букеты продавца пока нет 🎉</div>';
  box.innerHTML=list;
}
async function logout(){showLoader();await sb.auth.signOut();hideLoader();location.reload();}
boot();
</script>
</body>
</html>
